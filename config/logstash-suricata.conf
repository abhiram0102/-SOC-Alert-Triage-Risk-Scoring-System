# /etc/logstash/conf.d/suricata.conf
# Logstash pipeline: Filebeat → Logstash → Elasticsearch
# Parses Suricata EVE JSON, adds GeoIP, normalises fields, forwards to ES.

input {
  beats {
    port => 5044
    # Increase idle timeout for slow networks
    client_inactivity_timeout => 60
  }
}

filter {
  # ── Parse the JSON payload from Suricata EVE ──────────────────────
  json {
    source  => "message"
    # If parsing fails, tag the event and continue (don't crash pipeline)
    tag_on_failure => ["_jsonparsefailure"]
  }

  # ── Only process alert-type events ───────────────────────────────
  # Drop DNS, flow, http, stats, fileinfo, tls noise
  if [event_type] != "alert" {
    drop { }
  }

  # ── GeoIP enrichment for source IP ───────────────────────────────
  # Adds: src_geoip.country_name, src_geoip.city_name, src_geoip.location
  geoip {
    source           => "src_ip"
    target           => "src_geoip"
    tag_on_failure   => []
  }

  # ── GeoIP enrichment for destination IP ──────────────────────────
  geoip {
    source           => "dest_ip"
    target           => "dest_geoip"
    tag_on_failure   => []
  }

  # ── Flatten nested alert fields to top-level ─────────────────────
  # This makes Kibana field selection and ES queries much cleaner
  mutate {
    rename => {
      "[alert][signature]"    => "alert_signature"
      "[alert][severity]"     => "alert_severity"
      "[alert][category]"     => "alert_category"
      "[alert][signature_id]" => "alert_sid"
      "[alert][rev]"          => "alert_rev"
      "[alert][action]"       => "alert_action"
      "[alert][gid]"          => "alert_gid"
    }

    # Add pipeline-managed fields that Python will overwrite later
    add_field => {
      "risk_score"        => "PENDING"
      "enriched"          => "false"
      "ml_confidence"     => "0"
      "triage_timestamp"  => ""
    }

    # Lowercase the protocol for consistency
    lowercase => ["proto"]
  }

  # ── Convert numeric fields to correct types ───────────────────────
  mutate {
    convert => {
      "alert_severity" => "integer"
      "src_port"       => "integer"
      "dest_port"      => "integer"
      "alert_sid"      => "integer"
    }
  }

  # ── Remove large raw fields to save ES storage ────────────────────
  mutate {
    remove_field => [
      "message", "beat", "input", "log", "agent", "ecs",
      "[alert][payload]", "[alert][payload_printable]",
      "host", "tags"
    ]
  }

  # ── Date parsing: use Suricata's timestamp as @timestamp ──────────
  date {
    match   => ["timestamp", "ISO8601"]
    target  => "@timestamp"
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]

    # Daily rolling index for easy retention management
    # e.g.: suricata-alerts-2025.06.15
    index => "suricata-alerts-%{+YYYY.MM.dd}"

    # Use Suricata's flow_id as the ES document ID for idempotent writes
    # This prevents duplicate documents if Filebeat retries shipping
    document_id => "%{flow_id}"

    # Batching for throughput
    flush_size    => 500
    idle_flush_time => 1
  }

  # ── Stdout for debugging (remove or comment out in production) ────
  # stdout { codec => rubydebug }
}
